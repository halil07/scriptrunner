name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: sr-windows-x86_64.exe
            extension: .exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: sr-linux-x86_64
            extension: ""
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: sr-linux-aarch64
            extension: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: sr-macos-x86_64
            extension: ""
          - os: macos-15
            target: aarch64-apple-darwin
            asset: sr-macos-aarch64
            extension: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/sr${{ matrix.extension }}" "dist/${{ matrix.asset }}"

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
