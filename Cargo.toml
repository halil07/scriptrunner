[package]
name = "scriptrunner"
version = "0.0.6"
edition = "2021"

[[bin]]
name = "sr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
strip = true
lto = "thin"
